spring.application.name=task-manager

spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcGxhY2Vob2xkZXItc2VjcmV0LTMyYnl0ZXMhIQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}