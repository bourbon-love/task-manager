# Test configuration: replaces src/main/resources/application.properties during tests.
# Uses an in-memory H2 database so tests run without MySQL or Docker.

spring.application.name=task-manager

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

# Test-only secret (Base64, 32+ bytes). Never used outside tests.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1mb3ItdW5pdC10ZXN0cy0zMmJ5dGVz
jwt.expiration-ms=3600000
